<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Funding Radar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="kicker">AI Funding Radar</div>
  <h1><a href="#/">Grants &amp; funding</a></h1>
  <div class="sub" id="summary">Loading…</div>
  <a class="classic" href="/classic/">Classic view</a>
</header>
<main id="app">
  <section id="list-view">
    <form id="filters" class="filters" autocomplete="off">
      <input type="search" name="q" placeholder="Search name, org, description…" aria-label="Search">
      <label>My country (ISO)
        <input name="country" maxlength="2" size="3" placeholder="US" pattern="[A-Za-z]{2}">
      </label>
      <label>Entity
        <select name="entity">
          <option value="">any</option>
          <option value="none">none (individual)</option>
          <option value="org">org</option>
          <option value="ngo">NGO</option>
          <option value="company">company</option>
        </select>
      </label>
      <label>Applicant
        <select name="applicant">
          <option value="">any</option>
          <option value="individual">individual</option>
          <option value="team">team</option>
          <option value="org">org</option>
        </select>
      </label>
      <label>Deadline within
        <select name="window">
          <option value="">any</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </label>
      <label>Min amount ($)
        <input type="number" name="minAmount" min="0" step="1000" placeholder="0">
      </label>
      <label>Funding
        <select name="funding">
          <option value="">cash + credits</option>
          <option value="cash">cash</option>
          <option value="credits">credits</option>
        </select>
      </label>
      <label>Sort
        <select name="sort">
          <option value="deadline">deadline</option>
          <option value="amount">amount</option>
          <option value="name">name</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" name="onlyVerified"> only verified</label>
      <label class="check"><input type="checkbox" name="showExpired"> show expired</label>
    </form>
    <div class="count" id="count"></div>
    <ul class="grants" id="grants"></ul>
  </section>
  <section id="detail-view" hidden></section>
</main>
<footer class="top"><a href="/classic/">Classic view</a></footer>
<script src="filters.js"></script>
<script src="app.js"></script>
</body>
</html>
